---
# dr_orchestration/tasks/main.yml
# Author: Paul Bryant

- name: Confirm DR scope and VM mapping
  ansible.builtin.assert:
    that:
      - confirm_dr_operation | default(false) | bool
      - dr_vm_list | length > 0
      - dr_vm_list | selectattr('source_uuid', 'defined') | list | length == dr_vm_list | length
      - dr_vm_list | selectattr('dr_uuid', 'defined') | list | length == dr_vm_list | length
      - dr_vm_list | selectattr('health_endpoint', 'defined') | list | length == dr_vm_list | length
    fail_msg: "Set confirm_dr_operation=true after reviewing source_uuid, dr_uuid, and health_endpoint for each VM."

- name: Create DR report directory
  ansible.builtin.file:
    path: "{{ reports_dir }}"
    state: directory
    mode: '0750'

- name: Snapshot VMs before DR event
  uri:
    url: "https://{{ prism_central }}:9440/api/nutanix/v3/vms/{{ item.source_uuid }}/take_snapshot"
    method: POST
    user: "{{ prism_user }}"
    password: "{{ prism_pass }}"
    force_basic_auth: yes
    body_format: json
    body:
      snapshot_name: "DRTest_{{ item.name }}_{{ now(utc=true, fmt='%Y%m%d%H%M') }}"
    validate_certs: true
    status_code: [200, 202]
  no_log: true
  loop: "{{ dr_vm_list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Power on VMs at DR site
  uri:
    url: "https://{{ dr_prism_central }}:9440/api/nutanix/v3/vms/{{ item.dr_uuid }}/set_power_state"
    method: POST
    user: "{{ dr_prism_user }}"
    password: "{{ dr_prism_pass }}"
    force_basic_auth: yes
    body_format: json
    body:
      transition: "ON"
    validate_certs: true
    status_code: [200, 202]
  no_log: true
  loop: "{{ dr_vm_list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Run DR validation checks (HTTP/port/app health)
  uri:
    url: "{{ item.health_endpoint }}"
    method: GET
    validate_certs: true
  register: dr_validation
  loop: "{{ dr_vm_list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Generate DR compliance report
  copy:
    dest: "{{ reports_dir }}/dr_compliance_{{ now(utc=true, fmt='%Y%m%d%H%M') }}.json"
    content: "{{ dr_validation | to_nice_json }}"
  delegate_to: localhost
