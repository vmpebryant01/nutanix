---
# prism_user_map.yml
# Author: Paul Bryant
#
# Purpose: Export all Prism Central users and their group memberships.
#
# Usage:
#   ansible-playbook -i ../inventory/hosts.ini prism_user_map.yml --ask-vault-pass
#
# Output:
#   - docs/reports/prism_user_map.json

- name: Export Prism Central User Map
  hosts: prism_central
  connection: local
  gather_facts: no
  vars_files:
    - ../../.env.ansible_vault

  tasks:
    - name: Query all users and groups
      uri:
        url: "https://{{ prism_central }}:9440/api/nutanix/v3/groups/list"
        method: POST
        user: "{{ prism_user }}"
        password: "{{ prism_pass }}"
        force_basic_auth: yes
        body_format: json
        body: |
          { "kind": "group", "length": 100 }
        return_content: yes
        validate_certs: true
      register: groups

    - name: Write Prism user map to file
      copy:
        dest: "../../docs/reports/prism_user_map.json"
        content: "{{ groups.json | to_nice_json }}"
      delegate_to: localhost
