---
# project_mappings.yml
# Author: Paul Bryant
#
# Purpose: Export all project-to-VM or project-to-user assignments.
#
# Usage:
#   ansible-playbook -i ../inventory/hosts.ini project_mappings.yml --ask-vault-pass
#
# Output:
#   - docs/reports/project_mappings.json

- name: Export Project Mappings
  hosts: prism_central
  connection: local
  gather_facts: no
  vars_files:
    - ../../.env.ansible_vault

  tasks:
    - name: Query all projects
      uri:
        url: "https://{{ prism_central }}:9440/api/nutanix/v3/projects/list"
        method: POST
        user: "{{ prism_user }}"
        password: "{{ prism_pass }}"
        force_basic_auth: yes
        body_format: json
        body: |
          { "kind": "project", "length": 500 }
        return_content: yes
        validate_certs: true
      register: projects

    - name: Write project mappings to file
      copy:
        dest: "../../docs/reports/project_mappings.json"
        content: "{{ projects.json | to_nice_json }}"
      delegate_to: localhost
