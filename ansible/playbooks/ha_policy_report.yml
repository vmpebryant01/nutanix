---
# ha_policy_report.yml
# Author: Paul Bryant
#
# Purpose: Export a report on all HA (High Availability) policies set for clusters/VMs.
#
# Usage:
#   ansible-playbook -i ../inventory/hosts.ini ha_policy_report.yml --ask-vault-pass
#
# Output:
#   - docs/reports/ha_policy_report.json

- name: Export HA Policy Report
  hosts: prism_central
  gather_facts: no
  vars_files:
    - ../../.env.ansible_vault

  tasks:
    - name: Query all clusters for HA policy info
      uri:
        url: "https://{{ prism_central }}:9440/api/nutanix/v3/clusters/list"
        method: POST
        user: "{{ prism_user }}"
        password: "{{ prism_pass }}"
        force_basic_auth: yes
        body_format: json
        body: |
          { "kind": "cluster", "length": 100 }
        return_content: yes
        validate_certs: false
      register: clusters

    - name: Write HA policy report to file
      copy:
        dest: "../../docs/reports/ha_policy_report.json"
        content: "{{ clusters.json | to_nice_json }}"
      delegate_to: localhost
