---
# pci_compliance_report.yml
# Author: Paul Bryant
#
# Purpose: Check and export Nutanix cluster settings and VM configuration for PCI compliance.
#
# Usage:
#   ansible-playbook -i ../inventory/hosts.ini pci_compliance_report.yml --ask-vault-pass
#
# Output:
#   - docs/reports/pci_compliance_report.json

- name: Export PCI Compliance Report
  hosts: prism_central
  gather_facts: no
  vars_files:
    - ../../.env.ansible_vault

  tasks:
    - name: Query all VMs for PCI compliance check
      uri:
        url: "https://{{ prism_central }}:9440/api/nutanix/v3/vms/list"
        method: POST
        user: "{{ prism_user }}"
        password: "{{ prism_pass }}"
        force_basic_auth: yes
        body_format: json
        body: |
          { "kind": "vm", "length": 500 }
        return_content: yes
        validate_certs: false
      register: vms

    - name: Query all clusters for PCI relevant settings
      uri:
        url: "https://{{ prism_central }}:9440/api/nutanix/v3/clusters/list"
        method: POST
        user: "{{ prism_user }}"
        password: "{{ prism_pass }}"
        force_basic_auth: yes
        body_format: json
        body: |
          { "kind": "cluster", "length": 100 }
        return_content: yes
        validate_certs: false
      register: clusters

    - name: Write PCI compliance report to file
      copy:
        dest: "../../docs/reports/pci_compliance_report.json"
        content: |
          {
            "vms": {{ vms.json | to_nice_json }},
            "clusters": {{ clusters.json | to_nice_json }}
          }
      delegate_to: localhost
