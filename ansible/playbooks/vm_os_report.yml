---
# vm_os_report.yml
# Author: Paul Bryant
#
# Purpose: Export a report of all VMs and their detected OS types.
#
# Usage:
#   ansible-playbook -i ../inventory/hosts.ini vm_os_report.yml --ask-vault-pass
#
# Output:
#   - docs/reports/vm_os_report.json

- name: Export VM OS Report
  hosts: prism_central
  gather_facts: no
  vars_files:
    - ../../.env.ansible_vault

  tasks:
    - name: Query all VMs with OS info
      uri:
        url: "https://{{ prism_central }}:9440/api/nutanix/v3/vms/list"
        method: POST
        user: "{{ prism_user }}"
        password: "{{ prism_pass }}"
        force_basic_auth: yes
        body_format: json
        body: |
          { "kind": "vm", "length": 500 }
        return_content: yes
        validate_certs: false
      register: vms

    - name: Write OS report to file
      copy:
        dest: "../../docs/reports/vm_os_report.json"
        content: "{{ vms.json | to_nice_json }}"
      delegate_to: localhost
