---
# cmdb_drift_report.yml
# Author: Paul Bryant
#
# Purpose: Compare current Nutanix Prism inventory with CMDB and export a drift report.
#
# Usage:
#   ansible-playbook -i ../inventory/hosts.ini cmdb_drift_report.yml --ask-vault-pass
#
# Output:
#   - docs/reports/cmdb_drift_report.json

- name: CMDB Drift Report
  hosts: prism_central
  connection: local
  gather_facts: no
  vars_files:
    - ../../.env.ansible_vault

  tasks:
    - name: Query all VMs in Prism
      uri:
        url: "https://{{ prism_central }}:9440/api/nutanix/v3/vms/list"
        method: POST
        user: "{{ prism_user }}"
        password: "{{ prism_pass }}"
        force_basic_auth: yes
        body_format: json
        body: |
          { "kind": "vm", "length": 500 }
        return_content: yes
        validate_certs: true
      register: vms

    - name: Query all VMs in CMDB
      uri:
        url: "{{ cmdb_url }}"
        method: GET
        user: "{{ cmdb_user }}"
        password: "{{ cmdb_pass }}"
        force_basic_auth: yes
        validate_certs: true
      register: cmdb_vms

    - name: Find VM drift (present in Prism, missing from CMDB)
      set_fact:
        drift_vms: "{{ vms.json.entities | rejectattr('spec.name', 'in', cmdb_vms.json | map(attribute='name') | list) | list }}"

    - name: Write drift report to file
      copy:
        dest: "../../docs/reports/cmdb_drift_report.json"
        content: "{{ drift_vms | to_nice_json }}"
      delegate_to: localhost
