---
# Place this in ansible/playbooks/dr_orchestration.yml

- name: Automated DR Orchestration & Validation
  hosts: prism_dr_site
  connection: local
  gather_facts: no
  vars_files:
    - ../../.env.ansible_vault
    - ../../.env.dr_vault
  pre_tasks:
    - name: Read DR VM mapping
      community.general.read_csv:
        path: "{{ playbook_dir }}/../../csv_samples/dr_vms.csv"
      register: dr_vms
      delegate_to: localhost
  roles:
    - role: dr_orchestration
      dr_vm_list: "{{ dr_vms.list }}"
