---
# cluster_alerts.yml
# Author: Paul Bryant
#
# Purpose: Export current active alerts from all Nutanix clusters for monitoring/audit.
#
# Usage:
#   ansible-playbook -i ../inventory/hosts.ini cluster_alerts.yml --ask-vault-pass
#
# Output:
#   - docs/reports/cluster_alerts.json

- name: Export Cluster Alerts
  hosts: prism_central
  connection: local
  gather_facts: no
  vars_files:
    - ../../.env.ansible_vault

  tasks:
    - name: Query all alerts
      uri:
        url: "https://{{ prism_central }}:9440/api/nutanix/v3/alerts/list"
        method: POST
        user: "{{ prism_user }}"
        password: "{{ prism_pass }}"
        force_basic_auth: yes
        body_format: json
        body: |
          { "kind": "alert", "length": 500 }
        return_content: yes
        validate_certs: true
      register: alerts

    - name: Write alerts to file
      copy:
        dest: "../../docs/reports/cluster_alerts.json"
        content: "{{ alerts.json | to_nice_json }}"
      delegate_to: localhost
